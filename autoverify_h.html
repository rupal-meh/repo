<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Deeplinks</title>
<style>
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #f5f5f7;
    margin: 0;
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 {
    margin-bottom: 30px;
    color: #1d1d1f;
    font-size: 48px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    padding: 28px 30px;
    margin-bottom: 18px;
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .card h2 {
    font-size: 30px;
    margin: 0 0 10px 0;
    color: #1d1d1f;
  }
  .card p {
    font-size: 22px;
    color: #6e6e73;
    margin: 0 0 22px 0;
    word-break: break-all;
  }
  button {
    background: #0071e3;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 20px 40px;
    font-size: 26px;
    cursor: pointer;
  }
  button:hover {
    background: #0060c2;
  }
</style>
</head>
<body>
<h1>Deeplinks</h1>
<div class="card">
  <h2>Case 1: App Link Hijack</h2>
  <p>https://appstorage.onecloud.harman.com/deeplink/jbl_one/android/alexa?code=TEST_OAUTH_CODE_123</p>
  <button onclick="window.location.href='https://appstorage.onecloud.harman.com/deeplink/jbl_one/android/alexa?code=TEST_OAUTH_CODE_123'">Open Deeplink</button>
